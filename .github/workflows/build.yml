name: Build EnergyClient

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          
      - name: Download Gradle 9.8.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-9.8.0/bin" >> $GITHUB_PATH
          
      - name: Build with Gradle
        run: gradle build --no-daemon
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: energy-client-jar
          path: build/libs/*.jar

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR_PATH=$(ls build/libs/energy-1.0.0.jar || ls build/libs/energy-1.0.0+*.jar | head -n 1)
          if [ -f "$JAR_PATH" ]; then
            curl -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/java-archive" \
              --data-binary "@$JAR_PATH" \
              "https://uploads.github.com/repos/qwert564w/Graphit/releases/401370633/assets?name=energy-1.0.0.jar"
          else
            echo "JAR not found!"
            exit 1
          fi
