name: Build EnergyClient

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Download Gradle 9.8.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-9.8.0/bin" >> $GITHUB_PATH
          
      - name: Build with Gradle
        run: gradle build --no-daemon
        
      - name: Upload to Release v1.0.1-fixed
        if: success()
        run: |
          JAR_PATH=$(ls build/libs/energy-*.jar | grep -v sources | head -n 1)
          if [ -f "$JAR_PATH" ]; then
            echo "Found JAR: $JAR_PATH"
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/java-archive" \
              --data-binary "@$JAR_PATH" \
              "https://uploads.github.com/repos/qwert564w/Graphit/releases/401370633/assets?name=energy-1.0.0.jar"
            echo "Upload complete"
          else
            echo "JAR not found!"
            exit 1
          fi
