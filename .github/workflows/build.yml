name: Build EnergyClient

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          
      - name: Download Gradle 9.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-9.3/bin" >> $GITHUB_PATH
          
      - name: Build with Gradle
        run: gradle build --no-daemon
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: energy-client-jar
          path: build/libs/*.jar
